<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#374151" opacity="0.6" />
    </pattern>

    <style>
      .dynamic-float-1 {
        animation: floatOne 6s ease-in-out infinite alternate;
      }
      .dynamic-float-2 {
        animation: floatTwo 8s ease-in-out infinite alternate;
      }
      .dynamic-float-3 {
        animation: floatThree 7s ease-in-out infinite alternate;
      }
      .pulse-glow {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 6, 8;
        animation: dash 12s linear infinite;
      }

      @keyframes floatOne {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes floatThree {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        100% { opacity: 0.65; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -120; }
      }

      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #38bdf8;
        letter-spacing: 2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Glows (Background) -->
  <circle cx="240" cy="140" r="280" fill="url(#cyan-glow)" class="pulse-glow" />
  <circle cx="980" cy="220" r="320" fill="url(#purple-glow)" class="pulse-glow" />

  <!-- Animated Connection / Flow Curves (Behind foreground) -->
  <path d="M 120 340 C 350 260, 500 370, 750 310 C 920 270, 1020 330, 1120 280" 
        fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="dash-flow" />
  <path d="M 80 180 C 280 80, 540 160, 800 90 C 980 40, 1080 130, 1140 100" 
        fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.25" class="dash-flow" />

  <!-- Dynamic Animated Tech Floating Badges in Background Layer -->
  <g class="dynamic-float-1" opacity="0.75">
    <rect x="70" y="55" width="130" height="34" rx="17" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.2" />
    <circle cx="88" cy="72" r="5" fill="#38bdf8" />
    <text x="102" y="76" class="pill-text" fill="#e2e8f0">📝 Docs &amp; Notes</text>
  </g>

  <g class="dynamic-float-2" opacity="0.8">
    <rect x="1000" y="50" width="135" height="34" rx="17" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.2" />
    <circle cx="1018" cy="67" r="5" fill="#10b981" />
    <text x="1032" y="71" class="pill-text" fill="#e2e8f0">📊 Spreadsheets</text>
  </g>

  <g class="dynamic-float-3" opacity="0.75">
    <rect x="60" y="325" width="145" height="34" rx="17" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.2" />
    <circle cx="78" cy="342" r="5" fill="#f59e0b" />
    <text x="92" y="346" class="pill-text" fill="#e2e8f0">🔒 Self-Hosted / P2P</text>
  </g>

  <g class="dynamic-float-1" opacity="0.8">
    <rect x="990" y="325" width="145" height="34" rx="17" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.2" />
    <circle cx="1008" cy="342" r="5" fill="#ec4899" />
    <text x="1022" y="346" class="pill-text" fill="#e2e8f0">⚡ Real-Time Sync</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Key Features, Glassmorphism Hero Center -->
  <!-- Guaranteed high-contrast, fully readable foreground -->
  <g id="foreground-content">
    <!-- Category Pill Tagline -->
    <g transform="translate(600, 95)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
      <circle cx="-118" cy="0" r="4" fill="#38bdf8" />
      <text x="5" y="5" text-anchor="middle" class="tagline">ENTERPRISE &amp; OPEN SOURCE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" class="title" fill="url(#title-grad)">
      Awesome Cloud Office Productivity Suite
    </text>

    <!-- Subtitle -->
    <text x="600" y="212" text-anchor="middle" class="subtitle">
      Curated ecosystem of SaaS cloud suites, open-source office engines &amp; self-hosted collaboration stacks
    </text>

    <!-- Foreground Feature Pillars -->
    <g transform="translate(230, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="82" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">☁️ SaaS Leaders</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="175" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="87" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🔓 Open Source Stacks</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(385, 0)">
        <rect x="0" y="0" width="175" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="87" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🤝 Real-Time Collab</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(580, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="82" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🛡️ Data Sovereignty</text>
      </g>
    </g>

    <!-- Bottom Metadata Footprint -->
    <text x="600" y="365" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Microsoft 365 • Google Workspace • Nextcloud • ONLYOFFICE • AppFlowy • AFFiNE • LibreOffice • Collabora • Lark • CryptPad
    </text>
  </g>
</svg>
